app-id: com.baidu.NetDisk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
separate-locales: false
command: baidunetdisk
finish-args:
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-desktop:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --persist=.config/baidunetdisk
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  strip: false  # strip breaks application!
  no-debuginfo: true
tags:
  - proprietary

modules:
  - shared-modules/intltool/intltool-0.51.json
  - name: gtk2
    cleanup:
      - /bin
      - /include
      - /lib/gtk-2.0/include
      - /lib/pkgconfig
      - /share/aclocal
      - /share/gtk-2.0
      - /share/gtk-doc
      - /share/locale
      - '*.la'
    config-opts:
      - --disable-dependency-tracking
      - --disable-cups
      - --disable-gtk-doc-html
      - --disable-introspection
      - --with-xinput=xfree
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz
        sha256: ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da
      - type: patch
        paths:
          - shared-modules/gtk2/gtk2-fix-crash-in-show-uri.patch
          - shared-modules/gtk2/gtk2-gcc14.patch
          - shared-modules/gtk2/gtk2-gcc15.patch
  - name: sigc++
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/2.10/libsigc++-2.10.8.tar.xz
        sha256: 235a40bec7346c7b82b6a8caae0456353dc06e71f14bc414bcc858af1838719a
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/sigc++-2.0
  - name: glibmm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.4.tar.xz
        sha256: 199ace5682d81b15a1d565480b4a950682f2db6402c8aa5dd7217d71edff81d5
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/glibmm-2.4
      - /lib/giomm-2.4
      - /lib/libglibmm_generate_extra_defs*
  - name: cairomm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/cairo/cairomm/-/archive/1.14.3/cairomm-1.14.3.tar.gz
        sha256: 7dab16c5698acb284f178048337465b463fbed01c49e10bfe48acb0a852d873e
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cairomm-1.0
  - name: pangomm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.2.tar.xz
        sha256: 57442ab4dc043877bfe3839915731ab2d693fc6634a71614422fb530c9eaa6f4
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/pangomm-1.4
  - name: atkmm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/atkmm/2.28/atkmm-2.28.3.tar.xz
        sha256: 7c2088b486a909be8da2b18304e56c5f90884d1343c8da7367ea5cd3258b9969
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/atkmm-1.6
  - name: gtkmm
    config-opts:
      - --disable-dependency-tracking
      - --disable-documentation
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/2.24/gtkmm-2.24.5.tar.xz
        sha256: 0680a53b7bf90b4e4bf444d1d89e6df41c777e0bacc96e9c09fc4dd2f5fe6b72
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/gdkmm-2.4
      - /lib/gtkmm-2.4
      - /share/devhelp
      - /share/doc
      - '*.la'
  - name: baidunetdisk
    buildsystem: simple
    sources:
      - type: extra-data
        filename: baidunetdisk.rpm
        only-arches: [x86_64]
        url: https://pkg-ant.baidu.com/issue/netdisk/LinuxGuanjia/8.6.0/baidunetdisk-8.6.0.x86_64.rpm
        sha256: d5111eed08b150995b4e79912115d272d83117b39491122d6440b95353e8e2be
        size: 203578411
        x-checker-data:
          type: json
          url: https://pan.baidu.com/disk/cmsdata?do=client
          version-query: .linux.version | capture("V(?<version>\\d+(?:\\.\\d+)+)")
            | .version
          url-query: .linux.url
      - type: file
        path: com.baidu.NetDisk.metainfo.xml
      - type: file
        path: com.baidu.NetDisk.desktop
      - type: file
        path: com.baidu.NetDisk.svg
      - type: script
        dest-filename: baidunetdisk
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec /app/extra/baidunetdisk/baidunetdisk --no-sandbox "$@"
      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -xf baidunetdisk.rpm
          - mv opt/baidunetdisk /app/extra/
          - rm -rf baidunetdisk.rpm opt usr
    build-commands:
      - install -Dm644 com.baidu.NetDisk.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 com.baidu.NetDisk.desktop -t /app/share/applications/
      - install -Dm644 com.baidu.NetDisk.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm755 baidunetdisk -t /app/bin/
      - install -Dm755 apply_extra -t /app/bin/
